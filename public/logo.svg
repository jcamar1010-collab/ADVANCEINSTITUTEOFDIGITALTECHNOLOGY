      <line x1="-35" y1="6" x2="35" y2="6" stroke="url(#aidtGoldLinear)" stroke-width="2"/>
      <circle cx="-35" cy="6" r="3" fill="url(#aidtGoldLinear)"/>
      <circle cx="35" cy="6" r="3" fill="url(#aidtGoldLinear)"/>
