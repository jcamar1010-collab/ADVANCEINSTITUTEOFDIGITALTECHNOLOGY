  <g transform="translate(250, 390)">
    <path d="M -85,0 L -105,-15 L -95,15 Z" fill="#7a5509"/>
    <path d="M 85,0 L 105,-15 L 95,15 Z" fill="#7a5509"/>

    <path d="M -90,-15 
