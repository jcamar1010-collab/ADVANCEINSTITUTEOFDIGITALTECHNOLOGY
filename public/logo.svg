<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aidtGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="25%" stop-color="#e6b847"/>
      <stop offset="50%" stop-color="#c59427"/>
      <stop offset="75%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#9a6e13"/>
    </linearGradient>

    <radialGradient id="aidtShieldBevel" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d2c08"/>
      <stop offset="50%" stop-color="#181307"/>
      <stop offset="100%" stop-color="#080703"/>
    </radialGradient>

    <filter id="aidtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <path id="aidtTextArcTop" d="M 68,250 A 182,182 0 1,1 432,250" fill="none"/>
  </defs>

  <circle cx="250" cy="250" r="242" fill="#080808" filter="url(#aidtGlow)"/>
  <circle cx="250" cy="250" r="240" fill="none" stroke="url(#aidtGoldLinear)" stroke-width="6"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#221b0a" stroke-width="4"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#aidtGoldLinear)" stroke-width="4"/>
  <circle cx="250" cy="250" r="145" fill="none" stroke="url(#aidtGoldLinear)" stroke-width="3"/>

  <text font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="19.5" fill="url(#aidtGoldLinear)" letter-spacing="4.5">
