    <line x1="-55" y1="18" x2="55" y2="18" stroke="url(#aidtGoldLinear)" stroke-width="2.5"/>
    <circle cx="-55" cy="18" r="3" fill="url(#aidtGoldLinear)"/>
    <circle cx="0" cy="18" r="4.5" fill="none" stroke="url(#aidtGoldLinear)" stroke-width="2.5"/>
    <circle cx="55" cy="18" r="3" fill="url(#aidtGoldLinear)"/>

