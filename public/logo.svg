    <text x="0" y="10" 
          font-family="'Cinzel', serif" 
          font-weight="800" 
          font-size="20" 
          fill="url(#aidtGoldLinear)" 
          text-anchor="middle" 
          letter-spacing="4">
      • Est. 2018 •
