    <path d="M -95,30 Q -130,20 -128,-3 Q -115,12 -95,30"/>
    <path d="M -85,60 Q -125,60 -120,35 Q -105,48 -85,60"/>
    <path d="M -65,85 Q -105,95 -100,70 Q -85,80 -65,85"/>
    <path d="M -40,105 Q -75,120 -70,95 Q -55,102 -40,105"/>

    <path d="M 90,5 Q 120,-10 115,-30 Q 105,-15 90,5"/>
    <path d="M 95,30 Q 130,20 128,-3 Q 115,12 95,30"/>
    <path d="M 85,60 Q 125,60 120,35 Q 105,48 85,60"/>
    <path d="M 65,85 Q 105,95 100,70 Q 85,80 65,85"/>
    <path d="M 40,105 Q 75,120 70,95 Q 55,102 40,105"/>
