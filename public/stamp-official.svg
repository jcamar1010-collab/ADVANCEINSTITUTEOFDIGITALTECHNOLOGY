<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <path id="stampTop" d="M 35,150 A 115,115 0 1,1 265,150" fill="none"/>
    <path id="stampBottom" d="M 265,150 A 115,115 0 0,1 35,150" fill="none"/>
  </defs>

  <g transform="rotate(-6, 150, 150)" opacity="0.92">
    <!-- Outer Double Stamp Border -->
    <circle cx="150" cy="150" r="140" fill="none" stroke="#1d4ed8" stroke-width="4.5" stroke-dasharray="200, 2, 200, 2"/>
    <circle cx="150" cy="150" r="132" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
    <circle cx="150" cy="150" r="95" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

    <!-- Circular Top & Bottom Inscription -->
    <text font-family="'Cinzel', serif" font-weight="900" font-size="12" fill="#1d4ed8" letter-spacing="1.5">
      <textPath href="#stampTop" startOffset="50%" text-anchor="middle">
        ADVANCE INSTITUTE OF DIGITAL TECHNOLOGY
      </textPath>
    </text>

    <text font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#1d4ed8" letter-spacing="3">
      <textPath href="#stampBottom" startOffset="50%" text-anchor="middle">
        ★ AYODHYA CANTT (U.P.) ★
      </textPath>
    </text>

    <!-- Center Seal Content -->
    <g transform="translate(150, 150)" text-anchor="middle">
      <circle cx="0" cy="0" r="85" fill="#1d4ed8" fill-opacity="0.04"/>
      <!-- Inner Emblem Stars -->
      <text y="-35" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#1d4ed8" letter-spacing="1">REG. NO: AIDT/2020</text>
      
      <!-- Central Banner -->
      <rect x="-70" y="-18" width="140" height="34" rx="4" fill="#1d4ed8" fill-opacity="0.12" stroke="#1d4ed8" stroke-width="1.5"/>
      <text y="4" font-family="'Cinzel', serif" font-weight="900" font-size="16" fill="#1d4ed8" letter-spacing="2">OFFICIAL SEAL</text>

      <text y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#1d4ed8" letter-spacing="1.5">EXAM CONTROLLER</text>
      <text y="48" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1d4ed8">VERIFIED &amp; APPROVED</text>
    </g>

    <!-- Side Stars -->
    <circle cx="28" cy="150" r="3.5" fill="#1d4ed8"/>
    <circle cx="272" cy="150" r="3.5" fill="#1d4ed8"/>
  </g>
</svg>
